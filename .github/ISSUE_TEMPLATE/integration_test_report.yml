name: Integration Test Report
description: Try an import or a connected service with your own data and report what worked.
title: '[Integration Test] '
body:
- type: markdown
  attributes:
    value: |
      NoteTrace is tested against a small set of sample exports and services, so a report from your real data is extremely valuable. Reports of things that work are just as useful as reports of things that don't.
- type: dropdown
  id: integration
  attributes:
    label: Integration
    options:
    - Import from Google Keep (Takeout)
    - Import from Markdown files
    - Import from Blinko
    - Import from Memos
    - Import from Evernote (ENEX)
    - Send to CookTrace
    - Trace AI provider (chat, transcription, or image text)
    - MCP client (Claude Desktop, Cursor, Codex)
    - Sign-in with an OIDC provider
    - Something else
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: NoteTrace Version
    description: Shown in **Settings > About**.
    placeholder: e.g. v1.2.0
  validations:
    required: true
- type: input
  id: source
  attributes:
    label: Device, App, or Server Version
    placeholder: e.g. Google Takeout from September 2026 / Memos 0.25 / Blinko 1.2 backup / Evernote 10 export
  validations:
    required: false
- type: textarea
  id: worked
  attributes:
    label: What Worked
    value: |
      Mark each with a check, a cross, or n/a.

      - Note titles and text:
      - Formatting:
      - Checklists:
      - Labels or tags:
      - Pinned, archived, and trashed notes:
      - Reminders:
      - Images and attachments:
      - Created and edited dates:
  validations:
    required: false
- type: textarea
  id: broken
  attributes:
    label: What Didn't Work
    description: Specific entries, wrong values, error messages. Write "Everything worked" if it did.
  validations:
    required: true
- type: textarea
  id: sample
  attributes:
    label: Sample File or Address
    description: A small export with personal notes removed helps reproduce the problem.
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: Logs
    description: |
      **App log:** in NoteTrace, open **Settings > Diagnostics**, turn on **Diagnostic Mode**, make the problem happen, then open **View Diagnostic Logs** and copy it.

      **Server log:** `docker logs <container name> --tail 200`

      Remove anything private before posting: note contents, email addresses, auth tokens, AI API keys, OIDC client secrets, and your server's address.
    render: text
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots
    description: Drag files into this box.
  validations:
    required: false
