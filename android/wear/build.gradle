// NoteTrace on the wrist: checklists and the CookTrace shopping list, ticked
// off hands-free. A standalone Wear app, so it works on Wi-Fi or LTE without
// the phone nearby; the phone hands over the server address and a token once,
// through the Wearable Data Layer.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.notetrace.app.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.notetrace.app"
        // Wear OS 3 and up. Older watches run a different app model entirely.
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0-dev01"
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.wear.compose:compose-material3:1.5.0"
    implementation "androidx.wear.compose:compose-foundation:1.5.0"
    implementation "androidx.wear.compose:compose-navigation:1.5.0"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    // HttpURLConnection can't send PATCH, which ticking an item off needs.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
